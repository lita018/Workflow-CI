name: CI - Heart Disease ML Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # 3. Check environment
      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Working directory: $(pwd)"
          ls -la

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.6.0 pandas==2.2.3 \
                      numpy==2.2.1 matplotlib==3.10.0 seaborn==0.13.2 \
                      dagshub==0.4.1

      # 5. Set MLflow Tracking URI (DagsHub)
      - name: Set MLflow Tracking URI
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/heart-disease-ml.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      # 6. Run MLflow Project
      - name: Run mlflow project
        working-directory: MLProject
        run: |
          # 6. Run MLflow Project
      - name: Run mlflow project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local -P n_estimators=100 -P max_depth=10 -P min_samples_split=2 -P min_samples_leaf=1 -P data_dir=heart_disease_preprocessing

      # 7. Get latest MLflow run_id
      - name: Get latest MLflow run_id
        working-directory: MLProject
        run: |
          # Mengambil Run ID terakhir dari history local mlruns default (.mlfiles)
          RUN_ID=$(python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          # Ambil semua run di eksperimen default (0)
          runs = client.search_runs(experiment_ids=['0'], order_by=['start_time DESC'], max_results=1)
          if runs:
              print(runs[0].info.run_id)
          ")
          echo "Latest Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # 8. Upload Artifacts to GitHub
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: MLProject/artifacts/

      # 9. Build Docker Model (Advanced)
      - name: Build Docker Model
        working-directory: MLProject
        env:
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          if [ -n "$RUN_ID" ]; then
            mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "heart-disease-model" --enable-mlserver --python-version 3.12
          else
            echo "No run ID found, skipping Docker build"
          fi

      # 10. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag heart-disease-model ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest
          docker tag heart-disease-model ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:${{ github.run_number }}
          
      # 12. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:${{ github.run_number }}
          echo "Docker image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model"