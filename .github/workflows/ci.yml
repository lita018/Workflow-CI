name: CI - Heart Disease ML Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # 3. Check environment
      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Working directory: $(pwd)"
          ls -la

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.6.0 pandas==2.2.3 \
                      numpy==2.2.1 matplotlib==3.10.0 seaborn==0.13.2 \
                      dagshub==0.4.1

      # 5. Set MLflow Tracking URI (DagsHub)
      - name: Set MLflow Tracking URI
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/heart-disease-ml.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      # 6. Run MLflow Project
      - name: Run mlflow project
        working-directory: MLProject
        run: |
          mlflow run . \ --env-manager=local \ -P n_estimators=100 \ -P max_depth=10 \ -P min_samples_split=2 \ -P min_samples_leaf=1 \ -P data_dir=heart_disease_preprocessing

      # 7. Get latest MLflow run_id
      - name: Get latest MLflow run_id
        working-directory: MLProject
        run: |
          RUN_ID=$(python -c "
          import mlflow
          import os
          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name('Heart Disease - CI Pipeline')
          if exp:
              runs = client.search_runs([exp.experiment_id], order_by=['start_time DESC'], max_results=1)
              if runs:
                  print(runs[0].info.run_id)
          ")
          echo "Latest Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # 8. Install Python dependencies for upload
      - name: Install Python dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # 9. Upload artifacts to Google Drive
      - name: Upload to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import os
          import json
          import glob
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_data = json.loads(os.environ['GDRIVE_CREDENTIALS'])
          creds = service_account.Credentials.from_service_account_info(
              creds_data,
              scopes=['https://www.googleapis.com/auth/drive.file']
          )
          service = build('drive', 'v3', credentials=creds)

          # Create folder
          folder_meta = {
              'name': f"heart-disease-artifacts-{os.environ.get('GITHUB_RUN_NUMBER', 'local')}",
              'mimeType': 'application/vnd.google-apps.folder'
          }
          folder = service.files().create(body=folder_meta, fields='id').execute()
          folder_id = folder.get('id')
          print(f"Folder created: {folder_id}")

          # Upload artifact files
          artifact_files = glob.glob('MLProject/artifacts/**/*', recursive=True)
          for filepath in artifact_files:
              if os.path.isfile(filepath):
                  media = MediaFileUpload(filepath)
                  file_meta = {'name': os.path.basename(filepath), 'parents': [folder_id]}
                  service.files().create(body=file_meta, media_body=media, fields='id').execute()
                  print(f"Uploaded: {filepath}")

          print("Upload selesai!")
          EOF

      # 10. Build Docker Model (Advanced)
      - name: Build Docker Model
        working-directory: MLProject
        env:
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          if [ -n "$RUN_ID" ]; then
            mlflow models build-docker \
              --model-uri "runs:/$RUN_ID/model" \
              --name "heart-disease-model" \
              --enable-mlserver
          else
            echo "No run ID found, skipping Docker build"
          fi

      # 11. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 12. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag heart-disease-model \
            ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest
          docker tag heart-disease-model \
            ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:${{ github.run_number }}

      # 13. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:${{ github.run_number }}
          echo "Docker image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model"
